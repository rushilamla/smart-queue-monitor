[theme]
base = "dark"
primaryColor = "#D47A1A"
backgroundColor = "#0A0C0F"
secondaryBackgroundColor = "#12161C"
textColor = "#E4E7EC"
borderColor = "#1E2530"

font = "JetBrains Mono"
headingFont = "Space Grotesk"
baseFontSize = 14
metricValueFontSize = 32
metricValueFontWeight = 600

baseRadius = 4
showWidgetBorder = true
showSidebarBorder = true

paddingTop = 2.5
paddingBottom = 2.5